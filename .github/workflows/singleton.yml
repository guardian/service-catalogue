# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: Singleton image

permissions:
  contents: read
  # Allow the guardian/actions-ecr/push to authenticate with AWS using the Github OIDC token
  id-token: write
  # Allow the guardian/actions-ecr/push to comment on PRs
  pull-requests: write

on:
  pull_request:
    paths:
      - 'containers/singleton/**'
  push:
    branches:
      - main
    paths:
      - 'containers/singleton/**'

  # Manual invocation.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/singleton

# Ensure we only ever have one build running at a time.
# If we push twice in quick succession, the first build will be stopped once the second starts.
# This avoids any race conditions.
concurrency:
  group: ${{ github.ref }}/singleton
  cancel-in-progress: true

jobs:
  singleton:
    name: 'Build & Push singleton image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker buildx build -t singleton:latest ./containers/singleton

      - name: Publish image to ECR
        uses: guardian/actions-ecr/push@v1.0.1
        with:
          app: singleton
          roleArn: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
