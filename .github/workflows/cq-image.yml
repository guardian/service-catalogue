# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: CQ image

permissions:
  contents: read
  # Allow the guardian/actions-ecr/push to authenticate with AWS using the Github OIDC token
  id-token: write
  # Allow the guardian/actions-ecr/push to comment on PRs
  pull-requests: write

on:
  pull_request:
    paths:
      - 'containers/cloudquery/**'
  push:
    branches:
      - main
    paths:
      - 'containers/cloudquery/**'

  # Manual invocation.
  workflow_dispatch:

# Ensure we only ever have one build running at a time.
# If we push twice in quick succession, the first build will be stopped once the second starts.
# This avoids any race conditions.
concurrency:
  group: ${{ github.ref }}/cloudquery
  cancel-in-progress: true

jobs:
  cloudquery:
    name: 'Build & Push cloudquery image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set CQ_CLI
        run: |
          source .env
          echo $CQ_CLI
          echo "CQ_CLI=$CQ_CLI" >> "$GITHUB_ENV"

      - run: docker buildx build -t cloudquery:latest --build-arg CQ_CLI=$CQ_CLI ./containers/cloudquery

      - name: Publish image to ECR
        uses: guardian/actions-ecr/push@v1.0.1
        with:
          app: cloudquery
          roleArn: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
