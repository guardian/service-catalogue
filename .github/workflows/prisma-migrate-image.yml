# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: prisma-migrate image

permissions:
  contents: read
  # Allow the guardian/actions-ecr/push to authenticate with AWS using the Github OIDC token
  id-token: write
  # Allow the guardian/actions-ecr/push to comment on PRs
  pull-requests: write

on:
  pull_request:
    paths:
      - 'containers/prisma-migrate/**'
  push:
    branches:
      - main
    paths:
      - 'containers/prisma-migrate/**'

  # Manual invocation.
  workflow_dispatch:

# Ensure we only ever have one build running at a time.
# If we push twice in quick succession, the first build will be stopped once the second starts.
# This avoids any race conditions.
concurrency:
  group: ${{ github.ref }}/prisma-migrate
  cancel-in-progress: true

jobs:
  prisma-migrate:
    name: 'Build & Push prisma-migrate image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker buildx build -t prisma-migrate:latest ./containers/prisma-migrate

      - name: Publish image to ECR
        uses: guardian/actions-ecr/push@v1.0.1
        with:
          app: prisma-migrate
          roleArn: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
